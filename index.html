<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chronos Village 3D/4D RTS - Three.js Simulator</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #050811;
            color: #f1f5f9;
        }
        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }
        /* Custom UI Glassmorphism */
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6);
        }
        .glass-btn {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.03));
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-btn:hover {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.22), rgba(255, 255, 255, 0.08));
            border-color: rgba(255, 255, 255, 0.35);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        }
        .glass-btn:active {
            transform: translateY(0);
        }
        .glass-btn.active {
            border-color: #38bdf8;
            background: rgba(56, 189, 248, 0.3);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
        }
        #webgl-container {
            width: 100%;
            height: 100%;
            position: absolute;
            inset: 0;
            z-index: 0;
        }
        @keyframes chronoGlow {
            0% { box-shadow: 0 0 15px rgba(168, 85, 247, 0.4); }
            50% { box-shadow: 0 0 35px rgba(168, 85, 247, 0.8), 0 0 50px rgba(56, 189, 248, 0.6); }
            100% { box-shadow: 0 0 15px rgba(168, 85, 247, 0.4); }
        }
        .chrono-glow {
            animation: chronoGlow 3s infinite ease-in-out;
        }
    </style>
</head>
<body class="w-full h-full relative select-none">

    <!-- 3D THREE.JS WEBGL CONTAINER -->
    <div id="webgl-container"></div>

    <!-- UI OVERLAY LAYER -->
    <div id="uiOverlay" class="absolute inset-0 pointer-events-none z-10 flex flex-col justify-between p-3 md:p-5">
        
        <!-- HEADER / TOP BAR -->
        <div class="flex flex-wrap items-center justify-between gap-3 pointer-events-auto">
            <!-- Era & Dimension Badge -->
            <div class="glass-panel rounded-2xl px-4 py-2.5 flex items-center gap-3">
                <div id="eraIcon" class="w-10 h-10 rounded-xl bg-gradient-to-br from-amber-500 to-orange-600 flex items-center justify-center text-white text-xl shadow-lg shadow-amber-500/30">
                    <i class="fa-solid fa-campground"></i>
                </div>
                <div>
                    <div class="text-[10px] uppercase tracking-widest text-slate-400 font-semibold">Dimensi 4D Aktif</div>
                    <div id="eraTitle" class="text-lg font-bold font-orbitron tracking-wider text-amber-400">Era 1: Kuno (Ancient)</div>
                </div>
            </div>

            <!-- Global Resources Display -->
            <div class="glass-panel rounded-2xl px-4 py-2 flex flex-wrap items-center gap-4 md:gap-6 text-sm font-semibold">
                <div class="flex items-center gap-2" title="Warga Desa">
                    <i class="fa-solid fa-users text-sky-400"></i>
                    <span id="resPop">5/10</span>
                </div>
                <div class="flex items-center gap-2" title="Stok Makanan">
                    <i class="fa-solid fa-apple-whole text-emerald-400"></i>
                    <span id="resFood">150</span>
                </div>
                <div class="flex items-center gap-2" title="Kayu Konstruksi">
                    <i class="fa-solid fa-tree text-amber-600"></i>
                    <span id="resWood">120</span>
                </div>
                <div class="flex items-center gap-2" title="Batu & Mineral">
                    <i class="fa-solid fa-cubes text-slate-400"></i>
                    <span id="resStone">80</span>
                </div>
                <div class="flex items-center gap-2 bg-purple-950/60 px-3 py-1 rounded-xl border border-purple-500/30 text-purple-300" title="Energi Khusus 4D Chrono">
                    <i class="fa-solid fa-bolt text-purple-400 animate-pulse"></i>
                    <span id="resChrono" class="font-orbitron font-bold">25</span>
                </div>
            </div>

            <!-- Controls -->
            <div class="flex items-center gap-2">
                <button id="btnAudio" class="glass-btn w-10 h-10 rounded-xl flex items-center justify-center text-slate-300 hover:text-white" title="Toggle Sound">
                    <i class="fa-solid fa-volume-high"></i>
                </button>
                <button id="btnCenter" class="glass-btn w-10 h-10 rounded-xl flex items-center justify-center text-slate-300 hover:text-white" title="Pusatkan Kamera 3D">
                    <i class="fa-solid fa-crosshairs"></i>
                </button>
            </div>
        </div>

        <!-- SIDEBAR / FLOATING ACTION PANELS -->
        <div class="flex justify-between items-end gap-4 w-full pointer-events-none">
            
            <!-- LEFT PANEL: Selected Entity Info -->
            <div id="selectionPanel" class="glass-panel rounded-2xl p-4 w-72 md:w-80 pointer-events-auto transition-all duration-300 translate-y-full opacity-0">
                <div class="flex justify-between items-start mb-3 border-b border-slate-700/50 pb-2">
                    <div>
                        <h3 id="selName" class="font-bold text-base text-white">Warga Desa 3D</h3>
                        <p id="selSub" class="text-xs text-sky-400">Petani (Farmer)</p>
                    </div>
                    <button id="btnCloseSel" class="text-slate-400 hover:text-white text-sm"><i class="fa-solid fa-xmark"></i></button>
                </div>

                <!-- Status Bars -->
                <div id="selStatsVillager" class="space-y-2 mb-3 text-xs">
                    <div>
                        <div class="flex justify-between text-slate-300 mb-1">
                            <span>Kesehatan</span>
                            <span id="hpText">100/100</span>
                        </div>
                        <div class="w-full h-1.5 bg-slate-800 rounded-full overflow-hidden">
                            <div id="hpBar" class="h-full bg-emerald-500 transition-all duration-300" style="width: 100%;"></div>
                        </div>
                    </div>
                    <div>
                        <div class="flex justify-between text-slate-300 mb-1">
                            <span>Tingkat Kelaparan</span>
                            <span id="hungerText">0%</span>
                        </div>
                        <div class="w-full h-1.5 bg-slate-800 rounded-full overflow-hidden">
                            <div id="hungerBar" class="h-full bg-amber-500 transition-all duration-300" style="width: 0%;"></div>
                        </div>
                    </div>
                    <div class="text-[11px] text-slate-400 mt-1 flex justify-between">
                        <span>Aktivitas: <strong id="actionText" class="text-white">Bekerja</strong></span>
                        <span>Usia: <strong id="ageText" class="text-white">22th</strong></span>
                    </div>
                </div>

                <!-- Job Buttons -->
                <div id="selJobButtons" class="grid grid-cols-2 gap-1.5 pt-1">
                    <button data-job="farmer" class="btnJob glass-btn py-1.5 px-2 rounded-lg text-xs font-medium flex items-center justify-center gap-1 text-emerald-300">
                        <i class="fa-solid fa-wheat-awn"></i> Petani
                    </button>
                    <button data-job="lumberjack" class="btnJob glass-btn py-1.5 px-2 rounded-lg text-xs font-medium flex items-center justify-center gap-1 text-amber-400">
                        <i class="fa-solid fa-axe"></i> Penebang
                    </button>
                    <button data-job="miner" class="btnJob glass-btn py-1.5 px-2 rounded-lg text-xs font-medium flex items-center justify-center gap-1 text-purple-300">
                        <i class="fa-solid fa-pickaxe"></i> Penambang
                    </button>
                    <button data-job="builder" class="btnJob glass-btn py-1.5 px-2 rounded-lg text-xs font-medium flex items-center justify-center gap-1 text-sky-300">
                        <i class="fa-solid fa-hammer"></i> Pembangun
                    </button>
                </div>
            </div>

            <!-- RIGHT BOTTOM: Construction & 4D Era Shift -->
            <div class="flex flex-col items-end gap-3 pointer-events-auto">
                
                <!-- Era Shift 4D Button -->
                <div class="glass-panel p-2 rounded-2xl flex items-center gap-2 border-purple-500/40 chrono-glow">
                    <div class="px-2 text-xs font-orbitron font-bold text-purple-400 hidden md:block">
                        <i class="fa-solid fa-clock-rotate-left mr-1"></i> PERGESERAN ERA 4D
                    </div>
                    <button id="btnShiftEra" class="glass-btn px-4 py-2 rounded-xl text-xs font-orbitron font-bold text-white bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 flex items-center gap-2">
                        <i class="fa-solid fa-wand-magic-sparkles text-amber-300"></i>
                        <span>LOMPAT KE ERA BERIKUTNYA</span>
                        <span class="bg-purple-950 px-2 py-0.5 rounded text-[10px] text-purple-300 border border-purple-400/30">100 Chrono</span>
                    </button>
                </div>

                <!-- Construction Bar -->
                <div class="glass-panel p-2 rounded-2xl flex items-center gap-2 max-w-full overflow-x-auto">
                    <button data-build="house" class="btnBuild glass-btn p-2.5 rounded-xl flex flex-col items-center gap-1 min-w-[70px] text-xs">
                        <i class="fa-solid fa-house-chimney text-amber-400 text-lg"></i>
                        <span>Rumah</span>
                        <span class="text-[10px] text-slate-400">50 Wood</span>
                    </button>
                    <button data-build="farm" class="btnBuild glass-btn p-2.5 rounded-xl flex flex-col items-center gap-1 min-w-[70px] text-xs">
                        <i class="fa-solid fa-wheat-field text-emerald-400 text-lg"></i>
                        <span>Kebun</span>
                        <span class="text-[10px] text-slate-400">40 Wood</span>
                    </button>
                    <button data-build="lumber" class="btnBuild glass-btn p-2.5 rounded-xl flex flex-col items-center gap-1 min-w-[70px] text-xs">
                        <i class="fa-solid fa-campground text-orange-400 text-lg"></i>
                        <span>Kamp Kayu</span>
                        <span class="text-[10px] text-slate-400">60 Wood</span>
                    </button>
                    <button data-build="chrono_extractor" class="btnBuild glass-btn p-2.5 rounded-xl flex flex-col items-center gap-1 min-w-[70px] text-xs">
                        <i class="fa-solid fa-atom text-purple-400 text-lg"></i>
                        <span>Ekstraktor 4D</span>
                        <span class="text-[10px] text-slate-400">80 Stn/20 Ch</span>
                    </button>
                    <div class="h-8 w-px bg-slate-700/60 mx-1"></div>
                    <button id="btnSpawnVillager" class="glass-btn p-2.5 rounded-xl flex flex-col items-center gap-1 min-w-[75px] text-xs text-sky-300">
                        <i class="fa-solid fa-user-plus text-lg"></i>
                        <span>+ Warga</span>
                        <span class="text-[10px] text-slate-400">50 Food</span>
                    </button>
                </div>

            </div>

        </div>

    </div>

    <!-- NOTIFICATION CONTAINER -->
    <div id="toastContainer" class="absolute top-20 right-5 z-20 flex flex-col gap-2 pointer-events-none"></div>

    <!-- 3D ENGINE SCRIPT -->
    <script>
        /**
         * CHRONOS VILLAGE 3D / 4D RTS ENGINE
         * Built with Three.js (WebGL), Lighting & Procedural 3D Geometry
         */

        // --- AUDIO ENGINE ---
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.muted = false;
            }
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }
            playTone(freq, type, duration, vol = 0.1) {
                if (this.muted || !this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch(e){}
            }
            playClick() { this.playTone(600, 'sine', 0.05); }
            playBuild() { this.playTone(220, 'triangle', 0.2); }
            playEraShift() { this.playTone(800, 'sawtooth', 0.6, 0.15); }
        }
        const SFX = new SoundEngine();

        // --- GAME CONSTANTS ---
        const GRID_SIZE = 20;
        const TILE_SIZE = 4;
        const MAP_HALF = (GRID_SIZE * TILE_SIZE) / 2;

        const ERAS = [
            { id: 1, name: "Era 1: Kuno (Ancient)", bgTint: 0x090d16, fogColor: 0x090d16, chronoMult: 1, titleColor: "text-amber-400" },
            { id: 2, name: "Era 2: Kerajaan (Medieval)", bgTint: 0x0c1527, fogColor: 0x0c1527, chronoMult: 1.5, titleColor: "text-blue-400" },
            { id: 3, name: "Era 3: Modern Industrial", bgTint: 0x081c15, fogColor: 0x081c15, chronoMult: 2.2, titleColor: "text-emerald-400" },
            { id: 4, name: "Era 4: Cyberpunk 4D", bgTint: 0x160926, fogColor: 0x160926, chronoMult: 3.5, titleColor: "text-purple-400" }
        ];

        // --- GAME STATE ---
        const gameState = {
            eraIndex: 0,
            resources: { food: 200, wood: 150, stone: 100, chrono: 30 },
            maxPopulation: 10,
            villagers: [],
            buildings: [],
            grid: [],
            selectedEntity: null,
            buildingToPlace: null
        };

        // --- THREE.JS SCENE SETUP ---
        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(ERAS[0].bgTint);
        scene.fog = new THREE.FogExp2(ERAS[0].fogColor, 0.008);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 45, 55);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xfffaed, 0.9);
        dirLight.position.set(40, 60, 30);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 150;
        dirLight.shadow.camera.left = -50;
        dirLight.shadow.camera.right = 50;
        dirLight.shadow.camera.top = 50;
        dirLight.shadow.camera.bottom = -50;
        scene.add(dirLight);

        // Raycasting for Mouse Interaction
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        // Hover Placement Marker
        const previewGeo = new THREE.BoxGeometry(TILE_SIZE, 0.2, TILE_SIZE);
        const previewMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.5 });
        const placementPreview = new THREE.Mesh(previewGeo, previewMat);
        placementPreview.visible = false;
        scene.add(placementPreview);

        // --- TERRAIN GENERATION ---
        let terrainMesh;
        function createTerrain() {
            // Ground Island
            const groundGeo = new THREE.BoxGeometry(GRID_SIZE * TILE_SIZE, 2, GRID_SIZE * TILE_SIZE);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8 });
            terrainMesh = new THREE.Mesh(groundGeo, groundMat);
            terrainMesh.position.y = -1;
            terrainMesh.receiveShadow = true;
            scene.add(terrainMesh);

            // Water Plane Surrounding
            const waterGeo = new THREE.PlaneGeometry(300, 300);
            const waterMat = new THREE.MeshStandardMaterial({ color: 0x0284c7, roughness: 0.1, metalness: 0.8, transparent: true, opacity: 0.7 });
            const water = new THREE.Mesh(waterGeo, waterMat);
            water.rotation.x = -Math.PI / 2;
            water.position.y = -2;
            scene.add(water);

            // Initialize Grid Data
            for (let r = 0; r < GRID_SIZE; r++) {
                gameState.grid[r] = [];
                for (let c = 0; c < GRID_SIZE; c++) {
                    const worldX = (c * TILE_SIZE) - MAP_HALF + TILE_SIZE / 2;
                    const worldZ = (r * TILE_SIZE) - MAP_HALF + TILE_SIZE / 2;

                    let type = 'grass';
                    const rand = Math.random();
                    if (rand < 0.1) type = 'tree';
                    else if (rand < 0.14) type = 'stone';
                    else if (rand < 0.17) type = 'chrono_crystal';

                    gameState.grid[r][c] = { r, c, worldX, worldZ, type, building: null };

                    // Spawn 3D Natural Resource Props
                    if (type === 'tree') spawnTree3D(worldX, worldZ);
                    if (type === 'stone') spawnStone3D(worldX, worldZ);
                    if (type === 'chrono_crystal') spawnCrystal3D(worldX, worldZ);
                }
            }

            // Spawn Initial Townhall at Center
            const center = Math.floor(GRID_SIZE / 2);
            createBuilding('townhall', center, center);
            
            // Spawn Starting 3D Villagers
            for (let i = 0; i < 4; i++) {
                spawnVillager(center + (i % 2 === 0 ? 1 : -1), center + (i > 1 ? 1 : -1));
            }
        }

        // --- 3D RESOURCE PROPS ---
        function spawnTree3D(x, z) {
            const treeGroup = new THREE.Group();
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x78350f });
            const foliageMat = new THREE.MeshStandardMaterial({ color: 0x15803d, roughness: 0.6 });

            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.4, 2, 6), trunkMat);
            trunk.position.y = 1;
            trunk.castShadow = true;
            treeGroup.add(trunk);

            const foliage = new THREE.Mesh(new THREE.ConeGeometry(1.5, 3.5, 6), foliageMat);
            foliage.position.y = 3;
            foliage.castShadow = true;
            treeGroup.add(foliage);

            treeGroup.position.set(x, 0, z);
            scene.add(treeGroup);
        }

        function spawnStone3D(x, z) {
            const stoneMat = new THREE.MeshStandardMaterial({ color: 0x64748b, roughness: 0.9 });
            const stone = new THREE.Mesh(new THREE.DodecahedronGeometry(0.9), stoneMat);
            stone.position.set(x, 0.6, z);
            stone.castShadow = true;
            scene.add(stone);
        }

        function spawnCrystal3D(x, z) {
            const cryMat = new THREE.MeshStandardMaterial({ color: 0xc084fc, roughness: 0.2, metalness: 0.8, emissive: 0x6b21a8, emissiveIntensity: 0.5 });
            const crystal = new THREE.Mesh(new THREE.OctahedronGeometry(0.8), cryMat);
            crystal.position.set(x, 1, z);
            crystal.castShadow = true;
            scene.add(crystal);
        }

        // --- 3D VILLAGER CLASS ---
        class Villager3D {
            constructor(id, r, c) {
                this.id = id;
                this.name = ['Budi', 'Arya', 'Siti', 'Dewi', 'Rian', 'Eka', 'Giri', 'Laras'][Math.floor(Math.random() * 8)];
                this.job = 'farmer';
                this.hp = 100;
                this.hunger = 0;
                this.age = 20 + Math.floor(Math.random() * 10);
                this.state = 'working';

                const cell = gameState.grid[r][c];
                this.x = cell.worldX;
                this.z = cell.worldZ;
                this.targetX = this.x;
                this.targetZ = this.z;

                // Create 3D Humanoid Mesh Group
                this.group = new THREE.Group();
                const bodyMat = new THREE.MeshStandardMaterial({ color: 0x0284c7 });
                const headMat = new THREE.MeshStandardMaterial({ color: 0xffedd5 });

                // Body
                this.body = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.4, 1.2, 8), bodyMat);
                this.body.position.y = 0.6;
                this.body.castShadow = true;
                this.group.add(this.body);

                // Head
                const head = new THREE.Mesh(new THREE.SphereGeometry(0.3, 8, 8), headMat);
                head.position.y = 1.4;
                head.castShadow = true;
                this.group.add(head);

                this.group.position.set(this.x, 0, this.z);
                scene.add(this.group);
            }

            update() {
                // Hunger System
                this.hunger += 0.01;
                if (this.hunger >= 100) {
                    this.hp -= 0.05;
                    if (this.hp <= 0) {
                        this.die();
                        return;
                    }
                }

                if (this.hunger > 50 && gameState.resources.food >= 5) {
                    gameState.resources.food -= 5;
                    this.hunger = Math.max(0, this.hunger - 40);
                }

                // AI Movement
                const dist = Math.hypot(this.targetX - this.x, this.targetZ - this.z);
                if (dist > 0.2) {
                    const speed = 0.08;
                    this.x += ((this.targetX - this.x) / dist) * speed;
                    this.z += ((this.targetZ - this.z) / dist) * speed;
                    this.group.position.set(this.x, 0, this.z);
                    this.group.rotation.y = Math.atan2(this.targetX - this.x, this.targetZ - this.z);
                    this.body.rotation.z = Math.sin(Date.now() * 0.01) * 0.1; // Walking bobbing animation
                } else {
                    this.executeWork();
                }
            }

            executeWork() {
                if (Math.random() < 0.02) {
                    const mult = ERAS[gameState.eraIndex].chronoMult;
                    if (this.job === 'farmer') gameState.resources.food += Math.round(2 * mult);
                    if (this.job === 'lumberjack') gameState.resources.wood += Math.round(2 * mult);
                    if (this.job === 'miner') {
                        gameState.resources.stone += Math.round(1 * mult);
                        if (Math.random() < 0.3) gameState.resources.chrono += 1;
                    }

                    // Random wander
                    const offsetX = (Math.random() - 0.5) * 6;
                    const offsetZ = (Math.random() - 0.5) * 6;
                    this.targetX = Math.max(-MAP_HALF + 2, Math.min(MAP_HALF - 2, this.x + offsetX));
                    this.targetZ = Math.max(-MAP_HALF + 2, Math.min(MAP_HALF - 2, this.z + offsetZ));
                }
            }

            die() {
                scene.remove(this.group);
                const idx = gameState.villagers.indexOf(this);
                if (idx !== -1) gameState.villagers.splice(idx, 1);
                showToast(`${this.name} meninggal karena kelaparan!`, 'error');
            }
        }

        // --- 3D BUILDING CLASS ---
        class Building3D {
            constructor(type, r, c) {
                this.type = type;
                this.r = r;
                this.c = c;
                const cell = gameState.grid[r][c];
                this.x = cell.worldX;
                this.z = cell.worldZ;

                this.meshGroup = new THREE.Group();
                this.buildStructure();
                this.meshGroup.position.set(this.x, 0, this.z);
                scene.add(this.meshGroup);
            }

            buildStructure() {
                const era = gameState.eraIndex;
                let matColor = 0xd97706;
                if (era === 1) matColor = 0x3b82f6;
                if (era === 2) matColor = 0x10b981;
                if (era === 3) matColor = 0xa855f7;

                const wallMat = new THREE.MeshStandardMaterial({ color: matColor, roughness: 0.5 });
                const roofMat = new THREE.MeshStandardMaterial({ color: 0x991b1b, roughness: 0.3 });

                if (this.type === 'townhall') {
                    const base = new THREE.Mesh(new THREE.BoxGeometry(3.2, 2.5, 3.2), wallMat);
                    base.position.y = 1.25;
                    base.castShadow = true;
                    base.receiveShadow = true;
                    this.meshGroup.add(base);

                    const roof = new THREE.Mesh(new THREE.ConeGeometry(2.6, 2, 4), roofMat);
                    roof.position.y = 3.5;
                    roof.rotation.y = Math.PI / 4;
                    roof.castShadow = true;
                    this.meshGroup.add(roof);
                } else if (this.type === 'house') {
                    const house = new THREE.Mesh(new THREE.BoxGeometry(2.2, 1.8, 2.2), wallMat);
                    house.position.y = 0.9;
                    house.castShadow = true;
                    this.meshGroup.add(house);
                } else if (this.type === 'farm') {
                    const plotMat = new THREE.MeshStandardMaterial({ color: 0x15803d });
                    const plot = new THREE.Mesh(new THREE.BoxGeometry(3, 0.2, 3), plotMat);
                    plot.position.y = 0.1;
                    plot.receiveShadow = true;
                    this.meshGroup.add(plot);
                } else if (this.type === 'lumber') {
                    const campMat = new THREE.MeshStandardMaterial({ color: 0x78350f });
                    const camp = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.4, 1.2, 6), campMat);
                    camp.position.y = 0.6;
                    this.meshGroup.add(camp);
                } else if (this.type === 'chrono_extractor') {
                    const cryMat = new THREE.MeshStandardMaterial({ color: 0xc084fc, emissive: 0xa855f7, emissiveIntensity: 0.8 });
                    const core = new THREE.Mesh(new THREE.OctahedronGeometry(1.2), cryMat);
                    core.position.y = 2;
                    this.meshGroup.add(core);
                }
            }

            updateEraStyle() {
                scene.remove(this.meshGroup);
                this.meshGroup = new THREE.Group();
                this.buildStructure();
                this.meshGroup.position.set(this.x, 0, this.z);
                scene.add(this.meshGroup);
            }
        }

        // --- HELPER SPAWN FUNCTIONS ---
        function spawnVillager(r, c) {
            if (gameState.villagers.length >= gameState.maxPopulation) {
                showToast('Batas populasi tercapai! Bangun lebih banyak Rumah.', 'warning');
                return;
            }
            const v = new Villager3D(Date.now(), r, c);
            gameState.villagers.push(v);
            showToast(`Warga baru (${v.name}) bergabung!`, 'success');
        }

        function createBuilding(type, r, c) {
            if (r < 0 || r >= GRID_SIZE || c < 0 || c >= GRID_SIZE) return false;
            const cell = gameState.grid[r][c];
            if (cell.building) {
                showToast('Lokasi ini sudah ada bangunan!', 'error');
                return false;
            }

            const b = new Building3D(type, r, c);
            cell.building = b;
            gameState.buildings.push(b);

            if (type === 'house') gameState.maxPopulation += 4;
            SFX.playBuild();
            return true;
        }

        // --- INTERACTION & RAYCASTING ---
        let isDraggingCam = false;
        let previousMousePosition = { x: 0, y: 0 };

        window.addEventListener('mousedown', (e) => {
            SFX.init();
            if (e.target.closest('#uiOverlay')) return; // Ignore clicks on UI
            isDraggingCam = true;
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('mousemove', (e) => {
            // Update Raycaster for Hovering Tile
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(terrainMesh);

            if (intersects.length > 0 && gameState.buildingToPlace) {
                const point = intersects[0].point;
                const c = Math.floor((point.x + MAP_HALF) / TILE_SIZE);
                const r = Math.floor((point.z + MAP_HALF) / TILE_SIZE);

                if (r >= 0 && r < GRID_SIZE && c >= 0 && c < GRID_SIZE) {
                    const worldX = (c * TILE_SIZE) - MAP_HALF + TILE_SIZE / 2;
                    const worldZ = (r * TILE_SIZE) - MAP_HALF + TILE_SIZE / 2;
                    placementPreview.position.set(worldX, 0.2, worldZ);
                    placementPreview.visible = true;
                }
            } else {
                placementPreview.visible = false;
            }

            // Orbit Camera Dragging
            if (isDraggingCam) {
                const deltaX = e.clientX - previousMousePosition.x;
                const deltaY = e.clientY - previousMousePosition.y;

                camera.position.x -= deltaX * 0.1;
                camera.position.z -= deltaY * 0.1;
                previousMousePosition = { x: e.clientX, y: e.clientY };
            }
        });

        window.addEventListener('mouseup', (e) => {
            isDraggingCam = false;
        });

        window.addEventListener('click', (e) => {
            if (e.target.closest('#uiOverlay')) return;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(terrainMesh);

            if (intersects.length > 0) {
                const point = intersects[0].point;
                const c = Math.floor((point.x + MAP_HALF) / TILE_SIZE);
                const r = Math.floor((point.z + MAP_HALF) / TILE_SIZE);

                if (gameState.buildingToPlace) {
                    const costs = {
                        house: { wood: 50, stone: 0, chrono: 0 },
                        farm: { wood: 40, stone: 0, chrono: 0 },
                        lumber: { wood: 60, stone: 10, chrono: 0 },
                        chrono_extractor: { wood: 0, stone: 80, chrono: 20 }
                    };
                    const cost = costs[gameState.buildingToPlace];
                    if (gameState.resources.wood >= cost.wood && gameState.resources.stone >= cost.stone && gameState.resources.chrono >= cost.chrono) {
                        if (createBuilding(gameState.buildingToPlace, r, c)) {
                            gameState.resources.wood -= cost.wood;
                            gameState.resources.stone -= cost.stone;
                            gameState.resources.chrono -= cost.chrono;
                        }
                    } else {
                        showToast('Sumber daya tidak mencukupi!', 'error');
                    }
                    gameState.buildingToPlace = null;
                    placementPreview.visible = false;
                    document.querySelectorAll('.btnBuild').forEach(b => b.classList.remove('active'));
                    return;
                }

                // Check selection of Villagers
                const cell = gameState.grid[r]?.[c];
                const clickedVillager = gameState.villagers.find(v => Math.hypot(v.x - cell?.worldX, v.z - cell?.worldZ) < 2);
                if (clickedVillager) {
                    gameState.selectedEntity = clickedVillager;
                    showSelectionPanel(clickedVillager);
                    SFX.playClick();
                } else {
                    gameState.selectedEntity = null;
                    hideSelectionPanel();
                }
            }
        });

        // Zoom via Scroll
        window.addEventListener('wheel', (e) => {
            camera.position.y = Math.max(15, Math.min(90, camera.position.y + e.deltaY * 0.05));
        });

        // --- ANIMATION / RENDER LOOP ---
        function animate() {
            requestAnimationFrame(animate);

            // Update Villagers 3D
            gameState.villagers.forEach(v => v.update());

            // Rotate Extractor core crystals
            gameState.buildings.forEach(b => {
                if (b.type === 'chrono_extractor' && b.meshGroup.children[0]) {
                    b.meshGroup.children[0].rotation.y += 0.03;
                }
            });

            // Sync HUD Stats
            updateUI();

            renderer.render(scene, camera);
        }

        // Responsive Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- UI & CONTROL BINDINGS ---
        function updateUI() {
            document.getElementById('resPop').innerText = `${gameState.villagers.length}/${gameState.maxPopulation}`;
            document.getElementById('resFood').innerText = Math.floor(gameState.resources.food);
            document.getElementById('resWood').innerText = Math.floor(gameState.resources.wood);
            document.getElementById('resStone').innerText = Math.floor(gameState.resources.stone);
            document.getElementById('resChrono').innerText = Math.floor(gameState.resources.chrono);

            if (gameState.selectedEntity && gameState.selectedEntity instanceof Villager3D) {
                const v = gameState.selectedEntity;
                document.getElementById('hpBar').style.width = `${v.hp}%`;
                document.getElementById('hpText').innerText = `${Math.ceil(v.hp)}/100`;
                document.getElementById('hungerBar').style.width = `${v.hunger}%`;
                document.getElementById('hungerText').innerText = `${Math.floor(v.hunger)}%`;
            }
        }

        function showSelectionPanel(entity) {
            const panel = document.getElementById('selectionPanel');
            panel.classList.remove('translate-y-full', 'opacity-0');
            document.getElementById('selName').innerText = entity.name;
            document.getElementById('selSub').innerText = `Pekerjaan: ${entity.job.toUpperCase()}`;
        }

        function hideSelectionPanel() {
            document.getElementById('selectionPanel').classList.add('translate-y-full', 'opacity-0');
        }

        document.getElementById('btnCloseSel').addEventListener('click', hideSelectionPanel);

        // Job Selector Buttons
        document.querySelectorAll('.btnJob').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const job = e.currentTarget.getAttribute('data-job');
                if (gameState.selectedEntity && gameState.selectedEntity instanceof Villager3D) {
                    gameState.selectedEntity.job = job;
                    showToast(`Pekerjaan ${gameState.selectedEntity.name} diubah ke ${job}`, 'info');
                    showSelectionPanel(gameState.selectedEntity);
                    SFX.playClick();
                }
            });
        });

        // Build Buttons
        document.querySelectorAll('.btnBuild').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const type = e.currentTarget.getAttribute('data-build');
                document.querySelectorAll('.btnBuild').forEach(b => b.classList.remove('active'));
                if (gameState.buildingToPlace === type) {
                    gameState.buildingToPlace = null;
                } else {
                    gameState.buildingToPlace = type;
                    e.currentTarget.classList.add('active');
                    showToast(`Klik pada tanah 3D untuk menempatkan ${type}`, 'info');
                }
                SFX.playClick();
            });
        });

        // Spawn Villager Button
        document.getElementById('btnSpawnVillager').addEventListener('click', () => {
            if (gameState.resources.food >= 50) {
                gameState.resources.food -= 50;
                const center = Math.floor(GRID_SIZE / 2);
                spawnVillager(center + 1, center + 1);
                SFX.playClick();
            } else {
                showToast('Makanan tidak cukup (Butuh 50 Food)!', 'error');
            }
        });

        // 4D ERA SHIFT BUTTON
        document.getElementById('btnShiftEra').addEventListener('click', () => {
            if (gameState.resources.chrono >= 100) {
                gameState.resources.chrono -= 100;
                gameState.eraIndex = (gameState.eraIndex + 1) % ERAS.length;
                const currentEra = ERAS[gameState.eraIndex];

                // Change 3D Environment Background & Fog
                scene.background.setHex(currentEra.bgTint);
                scene.fog.color.setHex(currentEra.fogColor);

                // Update 3D Building Models Style
                gameState.buildings.forEach(b => b.updateEraStyle());

                document.getElementById('eraTitle').innerText = currentEra.name;
                document.getElementById('eraTitle').className = `text-lg font-bold font-orbitron tracking-wider ${currentEra.titleColor}`;

                SFX.playEraShift();
                showToast(`DIMENSI 4D BERGESER: ${currentEra.name}!`, 'success');
            } else {
                showToast('Energi Chrono 4D tidak cukup (Butuh 100 Chrono)!', 'error');
            }
        });

        // Center Camera
        document.getElementById('btnCenter').addEventListener('click', () => {
            camera.position.set(0, 45, 55);
            camera.lookAt(0, 0, 0);
            SFX.playClick();
        });

        // Audio Toggle
        document.getElementById('btnAudio').addEventListener('click', (e) => {
            SFX.muted = !SFX.muted;
            e.currentTarget.innerHTML = SFX.muted ? '<i class="fa-solid fa-volume-xmark text-red-400"></i>' : '<i class="fa-solid fa-volume-high"></i>';
        });

        // Toast Helper
        function showToast(msg, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            let bg = 'bg-slate-900/90 border-slate-700 text-slate-200';
            if (type === 'success') bg = 'bg-emerald-950/90 border-emerald-500/50 text-emerald-200';
            if (type === 'error') bg = 'bg-rose-950/90 border-rose-500/50 text-rose-200';
            if (type === 'warning') bg = 'bg-amber-950/90 border-amber-500/50 text-amber-200';

            toast.className = `glass-panel ${bg} border px-3 py-2 rounded-xl text-xs flex items-center gap-2 shadow-lg transition-all duration-300 transform translate-x-10 opacity-0`;
            toast.innerHTML = `<i class="fa-solid fa-circle-info"></i> <span>${msg}</span>`;

            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-x-10', 'opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-x-10');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        // Initialize World
        createTerrain();
        animate();
    </script>
</body>
</html>
